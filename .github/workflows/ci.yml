# The checks every change to master has to pass: types, lint, the unit suite
# and the build on each supported Node, the packed tarball installed and run,
# and the suites that only run inside the Docker sandbox.
#
# Also called by release.yml, so a tag is released only from a tree that
# passes exactly this.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

# Electron is only for packing the Mac app, which CI does not do.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22.13.0 is the floor: the first 22.x with node:sqlite unflagged
        # (package.json engines, bin/agent-master-3000.mjs). 26 is the current release.
        node: ['22.13.0', '22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - run: npm run build

  package:
    name: Package (install and run, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # prepack would build a second time; the build above is what gets packed.
      - run: npm pack --ignore-scripts
      - name: Install the tarball globally, into a throwaway prefix
        run: npm install -g --prefix "$RUNNER_TEMP/global" ./agent-master-3000-*.tgz
      - name: Run it with the fake agent
        run: |
          "$RUNNER_TEMP/global/bin/agent-master-3000" --version
          node scripts/smoke-package.mjs "$RUNNER_TEMP/global/bin/agent-master-3000"

  sandbox:
    name: Sandbox unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f sandbox/compose.yml build test
      # -T: no TTY on a runner. The `test` service has no network at all.
      - run: docker compose -f sandbox/compose.yml run --rm -T test
      - if: always()
        run: docker compose -f sandbox/compose.yml down -v

  sandbox-e2e:
    name: Sandbox e2e (real OpenCode, stub LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Everything runs in the image, sealed off from the network (see
      # sandbox/compose.e2e.yml), so the runner needs no Node of its own.
      - run: docker compose -f sandbox/compose.e2e.yml build e2e
      - run: docker compose -f sandbox/compose.e2e.yml run --rm -T e2e
