# The desktop app: `npm run desktop` builds the board and packs it as a Mac app
# into release/. See desktop/main.ts for what the app does.
appId: com.github.dino-keskic.agent-master-3000
productName: Agent Master 3000
directories:
  output: release
  buildResources: desktop/build
# Unpacked rather than in an asar archive: OpenCode starts the board's MCP
# server from dist-server/ as an ordinary file, and the server's worker thread
# and static files are read the same way.
asar: false
files:
  - package.json
  - dist/**
  - dist-server/**
  - dist-desktop/**
mac:
  category: public.app-category.developer-tools
  icon: desktop/build/icon.png
  target:
    - target: dmg
      arch: [arm64]
  # Ad-hoc signed until there is a Developer ID to sign with. Left unsigned,
  # packing breaks the signature Electron ships with, and Apple Silicon calls a
  # downloaded copy "damaged" with no way to open it. Ad-hoc, it is only
  # "unverified": Privacy & Security → Open Anyway opens it. Hardened runtime
  # would refuse Electron's frameworks under an ad-hoc signature (library
  # validation), and it only matters for notarizing, which this cannot do.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Dictating prompts uses the microphone.
dmg:
  title: Agent Master 3000
# No spaces: GitHub renames release assets that have them, and the Release
# workflow globs for this name.
artifactName: agent-master-3000-${version}-${arch}.${ext}
